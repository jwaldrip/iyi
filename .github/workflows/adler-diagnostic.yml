name: Adler fixed-path proof
on:
  push:
    branches: [diagnostic/adler-populations-7aa894b]
permissions:
  contents: read
  actions: read
jobs:
  proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    container:
      image: crystallang/crystal:1.21.0-build
    strategy:
      fail-fast: false
      matrix:
        mode: [idle, pinned]
        instance: [1, 2, 3]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 52f0e3dc1870094432d6cebd444983b01b8241ac
      - uses: actions/download-artifact@v5
        with:
          name: crystal
          path: .build
          run-id: 42191988061
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run: chmod +x .build/crystal && make -o .build/crystal iyi
      - name: Run actual digest gate and all negative controls
        shell: bash
        run: |
          set -euo pipefail
          if [ '${{ matrix.mode }}' = pinned ]; then
            cpu=$(python3 -c "import os; print(min(os.sched_getaffinity(0)))")
            taskset -c "$cpu" yes > /dev/null & load_pid=$!
            trap 'kill "$load_pid" 2>/dev/null || :' EXIT
            taskset -c "$cpu" bash bench/std_digest_exercise.sh
          else
            bash bench/std_digest_exercise.sh
          fi
