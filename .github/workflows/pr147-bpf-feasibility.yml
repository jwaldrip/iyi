name: BPF dependency and artifact build only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: jwaldrip/iyi
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require reviewed runner image
        shell: bash
        run: |
          set -euo pipefail
          if [ "${ImageOS:-}" != "ubuntu24" ] || [ "${ImageVersion:-}" != "20261101.360.1" ]; then
            echo "ERROR: runner image differs from reviewed baseline" >&2
            exit 1
          fi

      - name: Run safe fixture entrypoints
        shell: bash
        run: |
          set -euo pipefail
          /usr/bin/python3 -B proof/test_bpf_runner_baseline.py
          /usr/bin/python3 -B proof/test_bpf_build_script.py
          /usr/bin/python3 -B proof/test_bpf_dependencies.py

      - name: Compile and validate without launching helper
        id: build
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          evidence="$(mktemp -d "$RUNNER_TEMP/bpf-build-only.XXXXXXXX")"
          echo "directory=$evidence" >> "$GITHUB_OUTPUT"
          set +e
          bash proof/run_bpf_feasibility.sh --build-only --owned-dir "$evidence/owned" \
            > "$evidence/stdout.log" 2> "$evidence/stderr.log"
          status=$?
          set -e
          printf '%s\n' "$status" > "$evidence/exit-status.txt"
          cat "$evidence/stdout.log"
          cat "$evidence/stderr.log" >&2
          exit "$status"

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always() && steps.build.outputs.directory != ''
        with:
          name: pr147-bpf-build-only-evidence
          path: ${{ steps.build.outputs.directory }}/
          if-no-files-found: error
