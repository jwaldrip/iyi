name: BPF authenticated dependency check only

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: jwaldrip/iyi
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Require reviewed runner image
        shell: bash
        run: |
          set -euo pipefail
          if [ "${ImageOS:-}" != "ubuntu24" ] || [ "${ImageVersion:-}" != "20261101.360.1" ]; then
            echo "ERROR: runner image differs from reviewed ubuntu24 / 20261101.360.1 baseline" >&2
            exit 1
          fi

      - name: Verify authenticated dependencies without extraction
        id: check
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          owned="$(mktemp -d "$RUNNER_TEMP/bpf-check-only.XXXXXXXX")"
          echo "directory=$owned" >> "$GITHUB_OUTPUT"
          set +e
          /usr/bin/python3 -I proof/bpf_dependencies.py \
            --lock proof/bpf_dependencies.lock.json \
            --output "$owned/uncreated-output" \
            --receipt "$owned/uncreated-receipt.json" \
            --check-only > "$owned/stdout.log" 2> "$owned/stderr.log"
          status=$?
          set -e
          printf '%s\n' "$status" > "$owned/exit-status.txt"
          cat "$owned/stdout.log"
          cat "$owned/stderr.log" >&2
          exit "$status"

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always() && steps.check.outputs.directory != ''
        with:
          name: pr147-bpf-dependencies-check-only
          path: ${{ steps.check.outputs.directory }}/
          if-no-files-found: error
