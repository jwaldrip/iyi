name: BPF runner tool census (read only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Collect bounded runner inventory
        id: census
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          owned="$(mktemp -d "$RUNNER_TEMP/bpf-tool-census.XXXXXXXX")"
          echo "directory=$owned" >> "$GITHUB_OUTPUT"
          /usr/bin/python3 -I proof/bpf_tool_census.py "$owned"
      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        if: always() && steps.census.outputs.directory != ''
        with:
          name: pr147-bpf-runner-tool-census
          path: ${{ steps.census.outputs.directory }}/tool-census.json
          if-no-files-found: error
