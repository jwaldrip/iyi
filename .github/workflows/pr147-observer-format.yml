name: Format PR147 observer

on:
  push:
    branches:
      - proof/pr147-format-observer-20261109
    paths:
      - .github/workflows/pr147-observer-format.yml

permissions:
  contents: read

jobs:
  format:
    if: ${{ !contains(github.event.head_commit.message, '[skip formatter]') }}
    runs-on: ubuntu-24.04
    container: crystallang/crystal:1.21.0-build
    steps:
      - uses: actions/checkout@v7
        with:
          repository: jwaldrip/iyi
          ref: e4e7e5ed543690cafad11d0b5c1452a710b26d54
          persist-credentials: false
      - name: Build the fork compiler
        run: make crystal
      - name: Format the failing source
        run: |
          ./bin/crystal tool format src/std/observe.iyi
          ./bin/crystal tool format --check src/std/observe.iyi
          git -c safe.directory="$GITHUB_WORKSPACE" diff -- src/std/observe.iyi > observer-format.patch
          test -s observer-format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: pr147-observer-format-e4e7
          path: |
            src/std/observe.iyi
            observer-format.patch
          if-no-files-found: error
