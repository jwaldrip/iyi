name: Remote Strict Proof Chain (macOS 15)

# Branch-only macOS-15 GitHub Actions rail for PR147 strict chain.
# Validation-only mode runs automatically on push to the integrated repair branch
# (proof/strict-controller-integration-20261101 or proof/strict-lifecycle-repair-20261102),
# or manually via workflow_dispatch.
# Real strict execution is unconditionally refused nonzero before P1 build until
# independently authenticated authorization exists.

on:
  push:
    branches:
      - "master"
      - "proof/strict-controller-integration-20261101"
      - "proof/strict-lifecycle-repair-20261102"
      - "experiment/pr147-slice-c-workflow"
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode: 'validation-only' runs synthetic proofs and supervisor tests. 'strict-chain' prepares manifest and executes protected strict-proof gate."
        required: true
        type: choice
        options:
          - "validation-only"
          - "strict-chain"
        default: "validation-only"
      v_run_id:
        description: "Qualifying validation workflow run ID"
        required: false
        type: string
        default: ""
      v_artifacts:
        description: "Validation artifacts JSON string or file path containing artifact records with id, name, and sha256"
        required: false
        type: string
        default: ""
      review_path:
        description: "Repository-relative path to independent review file E"
        required: false
        type: string
        default: "proof/review_evidence.json"
      review_sha256:
        description: "Exact SHA-256 digest of independent review file E"
        required: false
        type: string
        default: ""
      review_verdict:
        description: "Independent review verdict (must be GO)"
        required: false
        type: string
        default: "GO"
      p_sha:
        description: "PR147 product commit SHA"
        required: false
        type: string
        default: ""
      w_sha:
        description: "Native proof commit SHA"
        required: false
        type: string
        default: ""
permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"
  PYTHONUTF8: "1"
  PYTHONPATH: "."
  P_AUTHORIZED_SHA: "180f14f91c829b25362a5ed34b20847f3ac2db77"
  W_AUTHORIZED_SHA: "b932ce0d97775c7061102a13db706f507dc84117"
  DRIVER_LIMIT_SEC: "2100"
  GRACE_SEC: "30"
  HOST_JOB_LIMIT_SEC: "21600"
  PAYLOAD_BUDGET_SEC: "19800"
  FINALIZATION_ALLOC_SEC: "1800"
  MIN_DISK_GIB: "20.0"

jobs:
  bootstrap-supervisor-bundle:
    name: "Generate supervisor bundle"
    if: ${{ github.event_name == 'push' || github.event.inputs.mode == 'validation-only' }}
    runs-on: ubuntu-latest
    outputs:
      bundle_id: ${{ steps.bundle.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Generate lockfile and distributable
        working-directory: .github/actions/strict-supervisor
        run: |
          npm install --package-lock-only
          npm ci
          npm run build
      - name: Upload generated files
        id: bundle
        uses: actions/upload-artifact@v4
        with:
          name: supervisor-bundle-${{ github.sha }}
          path: |
            .github/actions/strict-supervisor/package-lock.json
            .github/actions/strict-supervisor/dist/
          if-no-files-found: error
          include-hidden-files: true

  validation-proofs:
    name: "Controller synthetic and validation proofs (macOS 15)"
    needs: bootstrap-supervisor-bundle
    if: ${{ github.event_name == 'push' || github.event.inputs.mode == 'validation-only' }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout controller repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Pre-create CI diagnostic directories
        run: |
          mkdir -p "$RUNNER_TEMP/strict-ci/ci-logs" "$RUNNER_TEMP/strict-ci/fingerprints"

      - name: Record initial machine fingerprints and environment
        run: |
          echo "================================================================================"
          echo "INITIAL MACHINE FINGERPRINTS"
          echo "================================================================================"
          echo "Architecture: $(uname -m)"
          echo "OS: $(uname -s) $(uname -r) $(uname -v)"
          echo "CPU Brand: $(sysctl -n machdep.cpu.brand_string 2>/dev/null || true)"
          echo "Logical CPUs (hw.ncpu): $(sysctl -n hw.ncpu 2>/dev/null || true)"
          echo "Physical CPUs (hw.physicalcpu): $(sysctl -n hw.physicalcpu 2>/dev/null || true)"
          echo "Memory (bytes): $(sysctl -n hw.memsize 2>/dev/null || true)"
          vm_stat || true
          echo "Initial Disk Usage:"
          df -h /
          df -k /

      - name: Install bootstrap toolchain and DNS utilities
        run: |
          brew install crystal coreutils pkgconf bind

          # Expose only timeout via owned symlink; avoid GNU gnubin shadowing Darwin mktemp
          OWNED_BIN="$RUNNER_TEMP/owned-bin"
          mkdir -p "$OWNED_BIN"
          GTIMEOUT_PATH="$(brew --prefix)/bin/gtimeout"
          if [ -x "$GTIMEOUT_PATH" ]; then
            ln -sf "$GTIMEOUT_PATH" "$OWNED_BIN/timeout"
          elif [ -x "$(brew --prefix coreutils)/bin/gtimeout" ]; then
            ln -sf "$(brew --prefix coreutils)/bin/gtimeout" "$OWNED_BIN/timeout"
          else
            echo "ERROR: gtimeout not found in Homebrew prefix" >&2
            exit 1
          fi
          echo "$OWNED_BIN" >> "$GITHUB_PATH"

          # Add bind utilities (dig, nsupdate) to PATH
          BIND_BIN="$(brew --prefix bind)/bin"
          if [ -d "$BIND_BIN" ]; then
            echo "$BIND_BIN" >> "$GITHUB_PATH"
          fi

      - name: Verify Darwin BSD mktemp invariant
        run: |
          MKTEMP_PATH=$(which mktemp)
          echo "mktemp path: $MKTEMP_PATH"
          if [ "$MKTEMP_PATH" != "/usr/bin/mktemp" ]; then
            echo "ERROR: Darwin mktemp shadowed! Expected /usr/bin/mktemp, got $MKTEMP_PATH" >&2
            exit 1
          fi
          TEST_DIR=$(/usr/bin/mktemp -d -t iyi_check.XXXXXX)
          rm -rf "$TEST_DIR"
          echo "Darwin BSD /usr/bin/mktemp verified (not shadowed by GNU gnubin)"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml "idna==3.11" cryptography pillow h2 hpack
          python3 -c "import idna; assert idna.__version__ == '3.11', f'idna version mismatch: {idna.__version__}'"
          echo "idna==3.11 verified"

      - name: Verify approved oracle manifest before pre-pin
        run: |
          python3 -B proof/preflight_oracle.py --manifest proof/oracle_manifest.json

      - name: Record canonical modules, tool versions, and repository references
        run: |
          set -e
          set -o pipefail
          python3 -B - <<'PY'
          import hashlib, json, os, subprocess

          manifest = {
              "c_head": subprocess.check_output(["git", "rev-parse", "HEAD"]).decode().strip(),
              "branch": subprocess.check_output(["git", "rev-parse", "--abbrev-ref", "HEAD"]).decode().strip(),
              "python": subprocess.check_output(["python3", "--version"]).decode().strip(),
              "modules": {},
          }
          for mod in (
              "proof/proofkit.py",
              "proof/run_proof.py",
              "proof/remote_strict_controller.py",
              "proof/native_validation.py",
              "proof/remote_strict_fixtures.py",
              "proof/remote_strict_validation.py",
          ):
              if os.path.isfile(mod):
                  with open(mod, "rb") as f:
                      manifest["modules"][mod] = hashlib.sha256(f.read()).hexdigest()

          with open(os.path.join(os.environ["RUNNER_TEMP"], "strict-ci/fingerprints/manifest.json"), "w") as f:
              json.dump(manifest, f, indent=2)
          print("Recorded module fingerprints:", json.dumps(manifest, indent=2))
          PY

      - name: Resolve exact current job
        id: job-metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -B - <<'PY'
          import json, os, sys, urllib.request
          from datetime import datetime

          repo = os.environ["GITHUB_REPOSITORY"]
          run = os.environ["GITHUB_RUN_ID"]
          attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          key = os.environ["GITHUB_JOB"]
          runner = os.environ["RUNNER_NAME"]
          if not run.isdecimal() or not attempt.isdecimal() or key != "validation-proofs" or not runner:
              sys.exit("Invalid job context")
          jobs = []
          page = 1
          while True:
              url = (f"https://api.github.com/repos/{repo}/actions/runs/{run}/attempts/"
                     f"{attempt}/jobs?per_page=100&page={page}")
              request = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "iyi-strict-proof-ci",
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  batch = json.load(response)["jobs"]
              jobs.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
          matches = [j for j in jobs if j.get("name") == "Controller synthetic and validation proofs (macOS 15)"
                     and j.get("runner_name") == runner and j.get("status") == "in_progress"
                     and str(j.get("run_id")) == run and str(j.get("run_attempt")) == attempt]
          if len(matches) != 1:
              sys.exit(f"Expected exactly one current job, found {len(matches)}")
          job = matches[0]
          job_id = str(job.get("id", ""))
          started = job.get("started_at", "")
          if not job_id.isdecimal() or not started:
              sys.exit("Missing numeric job ID or start time")
          epoch = datetime.fromisoformat(started.replace("Z", "+00:00")).timestamp()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"job_started_at_iso={started}\njob_id={job_id}\njob_key={key}\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write(f"STRICT_JOB_START_ISO={started}\nSTRICT_JOB_START_EPOCH={epoch}\n")
          print(f"Matched job {job_id}, attempt {attempt}, key {key}")
          PY

      - name: Checkout actual P and W without building
        id: source-trees
        run: |
          set -euo pipefail
          for entry in "p:$P_AUTHORIZED_SHA" "w:$W_AUTHORIZED_SHA"; do
            label="${entry%%:*}"
            expected="${entry#*:}"
            path="$RUNNER_TEMP/strict-$label"
            git clone --quiet --no-checkout "$GITHUB_WORKSPACE" "$path"
            git -C "$path" checkout --quiet --detach "$expected"
            test "$(git -C "$path" rev-parse HEAD)" = "$expected"
            test -z "$(git -C "$path" status --porcelain)"
            echo "${label}_path=$path" >> "$GITHUB_OUTPUT"
          done
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          compiler="$RUNNER_TEMP/strict-fake-compiler"
          printf '#!/bin/sh\nexit 0\n' > "$compiler"
          chmod 700 "$compiler"
          echo "compiler=$compiler" >> "$GITHUB_OUTPUT"

      - name: Verify frozen supervisor bundle and test
        run: |
          set -euo pipefail
          npm --prefix .github/actions/strict-supervisor ci
          npm --prefix .github/actions/strict-supervisor run build
          git diff --exit-code -- .github/actions/strict-supervisor/dist
          npm --prefix .github/actions/strict-supervisor test
          DIST_PATH=".github/actions/strict-supervisor/dist/index.js"
          test -f "$DIST_PATH"
          BUNDLE_SHA=$(shasum -a 256 "$DIST_PATH" | awk '{print $1}')
          echo "Verified action bundle SHA-256: $BUNDLE_SHA"
          echo "{\"bundle_sha256\": \"$BUNDLE_SHA\"}" > "$RUNNER_TEMP/strict-ci/fingerprints/bundle.json"
          # The following uses: steps must execute the tracked bundle without source dependencies.
          rm -rf .github/actions/strict-supervisor/node_modules

      - name: Run Python deterministic controller test suite with watchdog
        run: |
          set -e
          set -o pipefail
          echo "================================================================================"
          echo "Running RemoteStrictController deterministic contract tests (600s watchdog)"
          echo "================================================================================"

          # Bounded 600-second suite watchdog with faulthandler diagnostics
          PYTHONFAULTHANDLER=1 timeout 600s python3 -B -X faulthandler -m unittest discover -s proof -p 'test_remote_strict*.py' -v 2>&1 | tee "$RUNNER_TEMP/strict-ci/ci-logs/python-controller-suite.log"

      - name: Verify exact strict mode refusal without independent authorization
        run: |
          set -e
          set -o pipefail
          echo "================================================================================"
          echo "Verifying exact strict mode refusal (exit 5, AUTH_REFUSED)..."
          echo "================================================================================"

          set +e
          python3 -B -m proof.remote_strict_controller \
            --mode strict \
            --p "${{ steps.source-trees.outputs.p_path }}" \
            --w "${{ steps.source-trees.outputs.w_path }}" \
            --compiler "${{ steps.source-trees.outputs.compiler }}" \
            --job-start-time "$STRICT_JOB_START_ISO" \
            --artifacts-dir "$RUNNER_TEMP/strict-ci/strict-refusal" \
            --driver-limit-sec 2100 \
            --grace-sec 30 > "$RUNNER_TEMP/strict-ci/ci-logs/strict-refusal.stdout.log" 2> "$RUNNER_TEMP/strict-ci/ci-logs/strict-refusal.stderr.log"
          RC=$?
          set -e

          echo "Strict mode exit code: $RC"
          if [ "$RC" -ne 5 ]; then
            echo "ERROR: Expected strict refusal exit code 5, got $RC" >&2
            cat "$RUNNER_TEMP/strict-ci/ci-logs/strict-refusal.stderr.log" >&2
            exit 1
          fi

          SUMMARY_FILE="$RUNNER_TEMP/strict-ci/strict-refusal/strict-controller-summary.json"
          if [ ! -f "$SUMMARY_FILE" ]; then
            echo "ERROR: Summary file missing from strict refusal: $SUMMARY_FILE" >&2
            exit 1
          fi

          python3 -c "
          import json, sys
          with open('$SUMMARY_FILE', 'r') as f:
              s = json.load(f)
          assert s.get('overall_status') == 'AUTH_REFUSED', f'Expected overall_status AUTH_REFUSED, got {s.get(\"overall_status\")}'
          assert len(s.get('records', [])) == 0, f'Expected 0 stage records launched, got {len(s.get(\"records\"))}'
          print('Strict refusal VERIFIED: exit=5, overall_status=AUTH_REFUSED, zero stages launched.')
          "

      - name: Synthetic capacity success
        id: success-case
        uses: ./.github/actions/strict-supervisor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mode: validation-only
          validation_case: success
          invocation_id: synthetic-success
          case_data_dir: ${{ runner.temp }}/strict-case-success
          p: ${{ steps.source-trees.outputs.p_path }}
          w: ${{ steps.source-trees.outputs.w_path }}
          compiler: ${{ steps.source-trees.outputs.compiler }}
          artifacts_dir: ${{ runner.temp }}/strict-artifacts-success
          job_start_time: ${{ steps.job-metadata.outputs.job_started_at_iso }}
          job_id: ${{ steps.job-metadata.outputs.job_id }}
          job_key: ${{ steps.job-metadata.outputs.job_key }}
          p_sha: ${{ env.P_AUTHORIZED_SHA }}
          w_sha: ${{ env.W_AUTHORIZED_SHA }}
          c_sha: ${{ github.sha }}

      - name: Synthetic failed plan
        id: failed-plan-case
        continue-on-error: true
        uses: ./.github/actions/strict-supervisor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mode: validation-only
          validation_case: failed-plan
          invocation_id: synthetic-failed-plan
          case_data_dir: ${{ runner.temp }}/strict-case-failed-plan
          p: ${{ steps.source-trees.outputs.p_path }}
          w: ${{ steps.source-trees.outputs.w_path }}
          compiler: ${{ steps.source-trees.outputs.compiler }}
          artifacts_dir: ${{ runner.temp }}/strict-artifacts-failed-plan
          job_start_time: ${{ steps.job-metadata.outputs.job_started_at_iso }}
          job_id: ${{ steps.job-metadata.outputs.job_id }}
          job_key: ${{ steps.job-metadata.outputs.job_key }}
          p_sha: ${{ env.P_AUTHORIZED_SHA }}
          w_sha: ${{ env.W_AUTHORIZED_SHA }}
          c_sha: ${{ github.sha }}

      - name: Synthetic failed pin
        id: failed-pin-case
        continue-on-error: true
        uses: ./.github/actions/strict-supervisor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mode: validation-only
          validation_case: failed-pin
          invocation_id: synthetic-failed-pin
          case_data_dir: ${{ runner.temp }}/strict-case-failed-pin
          p: ${{ steps.source-trees.outputs.p_path }}
          w: ${{ steps.source-trees.outputs.w_path }}
          compiler: ${{ steps.source-trees.outputs.compiler }}
          artifacts_dir: ${{ runner.temp }}/strict-artifacts-failed-pin
          job_start_time: ${{ steps.job-metadata.outputs.job_started_at_iso }}
          job_id: ${{ steps.job-metadata.outputs.job_id }}
          job_key: ${{ steps.job-metadata.outputs.job_key }}
          p_sha: ${{ env.P_AUTHORIZED_SHA }}
          w_sha: ${{ env.W_AUTHORIZED_SHA }}
          c_sha: ${{ github.sha }}

      - name: Synthetic Run3 divergence
        id: divergence-case
        continue-on-error: true
        uses: ./.github/actions/strict-supervisor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mode: validation-only
          validation_case: divergence
          invocation_id: synthetic-divergence
          case_data_dir: ${{ runner.temp }}/strict-case-divergence
          p: ${{ steps.source-trees.outputs.p_path }}
          w: ${{ steps.source-trees.outputs.w_path }}
          compiler: ${{ steps.source-trees.outputs.compiler }}
          artifacts_dir: ${{ runner.temp }}/strict-artifacts-divergence
          job_start_time: ${{ steps.job-metadata.outputs.job_started_at_iso }}
          job_id: ${{ steps.job-metadata.outputs.job_id }}
          job_key: ${{ steps.job-metadata.outputs.job_key }}
          p_sha: ${{ env.P_AUTHORIZED_SHA }}
          w_sha: ${{ env.W_AUTHORIZED_SHA }}
          c_sha: ${{ github.sha }}

      - name: Synthetic cleanup failure
        id: cleanup-case
        continue-on-error: true
        uses: ./.github/actions/strict-supervisor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mode: validation-only
          validation_case: cleanup-failure
          invocation_id: synthetic-cleanup-failure
          case_data_dir: ${{ runner.temp }}/strict-case-cleanup-failure
          p: ${{ steps.source-trees.outputs.p_path }}
          w: ${{ steps.source-trees.outputs.w_path }}
          compiler: ${{ steps.source-trees.outputs.compiler }}
          artifacts_dir: ${{ runner.temp }}/strict-artifacts-cleanup-failure
          job_start_time: ${{ steps.job-metadata.outputs.job_started_at_iso }}
          job_id: ${{ steps.job-metadata.outputs.job_id }}
          job_key: ${{ steps.job-metadata.outputs.job_key }}
          p_sha: ${{ env.P_AUTHORIZED_SHA }}
          w_sha: ${{ env.W_AUTHORIZED_SHA }}
          c_sha: ${{ github.sha }}

      - name: Download exact artifact IDs and independently check all cases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          W_PATH: ${{ steps.source-trees.outputs.w_path }}
          P_PATH: ${{ steps.source-trees.outputs.p_path }}
          COMPILER_PATH: ${{ steps.source-trees.outputs.compiler }}
          JOB_ID: ${{ steps.job-metadata.outputs.job_id }}
          JOB_KEY: ${{ steps.job-metadata.outputs.job_key }}
          SUCCESS_INDEX: ${{ steps.success-case.outputs.receipt_index_path }}
          PLAN_INDEX: ${{ steps.failed-plan-case.outputs.receipt_index_path }}
          PIN_INDEX: ${{ steps.failed-pin-case.outputs.receipt_index_path }}
          DIVERGENCE_INDEX: ${{ steps.divergence-case.outputs.receipt_index_path }}
          CLEANUP_INDEX: ${{ steps.cleanup-case.outputs.receipt_index_path }}
          SUCCESS_OUTCOME: ${{ steps.success-case.outcome }}
          PLAN_OUTCOME: ${{ steps.failed-plan-case.outcome }}
          PIN_OUTCOME: ${{ steps.failed-pin-case.outcome }}
          DIVERGENCE_OUTCOME: ${{ steps.divergence-case.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup-case.outcome }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import io, json, os, pathlib, subprocess, sys, tarfile, zipfile
          from proof.github_artifact import download_artifact_zip

          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          downloads = temp / "strict-exact-downloads"
          reports = temp / "strict-checked-reports"
          downloads.mkdir()
          reports.mkdir()
          cases = [
              ("success", "SUCCESS", 37), ("failed-plan", "PLAN", 1),
              ("failed-pin", "PIN", 2), ("divergence", "DIVERGENCE", 6),
              ("cleanup-failure", "CLEANUP", 4),
          ]
          seen = set()
          for case, prefix, expected_count in cases:
              expected_outcome = "success" if case == "success" else "failure"
              if os.environ[prefix + "_OUTCOME"] != expected_outcome:
                  sys.exit(f"{case}: unexpected action outcome")
              index = pathlib.Path(os.environ[prefix + "_INDEX"])
              with index.open(encoding="utf-8") as f:
                  envelope = json.load(f)
              entries = envelope["entries"]
              if len(entries) != expected_count:
                  sys.exit(f"{case}: expected {expected_count} artifacts, got {len(entries)}")
              for entry in entries:
                  artifact_id = str(entry["ack"]["artifact_id"])
                  if not artifact_id.isdecimal() or artifact_id in seen:
                      sys.exit(f"{case}: invalid or duplicate artifact ID")
                  seen.add(artifact_id)
                  url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{artifact_id}/zip"
                  payload = download_artifact_zip(url, os.environ["GH_TOKEN"])
                  with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                      files = [item for item in archive.infolist() if not item.is_dir()]
                      if len(files) != 1 or files[0].file_size > 100_000_000:
                          sys.exit(f"{case}: invalid downloaded artifact layout")
                      data = archive.read(files[0])
                  (downloads / f"{artifact_id}.tar").write_bytes(data)
              command = ["python3", "-B", "proof/check_remote_strict_evidence.py",
                         "--index", str(index), "--downloads-dir", str(downloads),
                         "--case", case, "--p", os.environ["P_PATH"], "--w", os.environ["W_PATH"],
                         "--c", os.environ["GITHUB_WORKSPACE"], "--compiler", os.environ["COMPILER_PATH"],
                         "--repository", os.environ["GITHUB_REPOSITORY"],
                         "--run-id", os.environ["GITHUB_RUN_ID"], "--run-attempt", os.environ["GITHUB_RUN_ATTEMPT"],
                         "--job-id", os.environ["JOB_ID"], "--job-key", os.environ["JOB_KEY"],
                         "--invocation-id", "synthetic-" + case, "--report", str(reports / f"{case}.json")]
              if case == "divergence":
                  command += ["--expected-divergence", str(temp / "strict-case-divergence" / "divergence.bin")]
              subprocess.run(command, check=True)
          if len(seen) != 50:
              sys.exit("Expected exactly 50 distinct incremental artifact IDs")
          (temp / "strict-checked-ids.json").write_text(json.dumps(sorted(seen)), encoding="utf-8")
          export = temp / "strict-verified-evidence.tar"
          with tarfile.open(export, "w") as tar:
              for case in [item[0] for item in cases]:
                  report = reports / f"{case}.json"
                  if not report.is_file() or report.is_symlink():
                      sys.exit(f"{case}: checked report missing or unsafe")
                  tar.add(report, arcname=f"{case}.json", recursive=False)
          PY

      - name: Upload checked sealed evidence
        id: sealed-export
        uses: actions/upload-artifact@v4
        with:
          name: remote-strict-validation-evidence
          path: ${{ runner.temp }}/strict-verified-evidence.tar
          retention-days: 14
          if-no-files-found: error

      - name: Check exact hosted artifact inventory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPORT_ID: ${{ steps.sealed-export.outputs.artifact-id }}
          BUNDLE_ID: ${{ needs.bootstrap-supervisor-bundle.outputs.bundle_id }}
        run: |
          python3 -B - <<'PY'
          import json, os, pathlib, sys, urllib.request
          expected = set(json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "strict-checked-ids.json").read_text()))
          export = os.environ["EXPORT_ID"]
          if not export.isdecimal() or export in expected:
              sys.exit("Missing or duplicate sealed export ID")
          expected.add(export)
          bundle = os.environ["BUNDLE_ID"]
          if not bundle.isdecimal() or bundle in expected:
              sys.exit("Missing or duplicate supervisor bundle ID")
          expected.add(bundle)
          ids = []
          page = 1
          while True:
              url = (f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                     f"{os.environ['GITHUB_RUN_ID']}/artifacts?per_page=100&page={page}")
              request = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "iyi-strict-proof-ci",
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  batch = json.load(response)["artifacts"]
              ids.extend(str(item["id"]) for item in batch)
              if len(batch) < 100:
                  break
              page += 1
          if len(ids) != 52 or set(ids) != expected:
              sys.exit(f"Hosted inventory mismatch: expected 52 exact IDs, got {len(ids)}")
          print("Verified all 52 exact artifact IDs")
          PY

  ownership-recovery:
    name: "Ownership recovery (${{ matrix.case }})"
    needs: validation-proofs
    if: ${{ github.event_name == 'push' || github.event.inputs.mode == 'validation-only' }}
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        case: [ownership-crash, ownership-census-outage, ownership-run1-outage]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install Python dependencies
        run: python3 -m pip install pyyaml "idna==3.11" cryptography pillow h2 hpack
      - name: Resolve job and source trees
        id: setup
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          for label in p w; do
            if [ "$label" = p ]; then sha="$P_AUTHORIZED_SHA"; else sha="$W_AUTHORIZED_SHA"; fi
            git clone --quiet --no-checkout "$GITHUB_WORKSPACE" "$RUNNER_TEMP/strict-$label"
            git -C "$RUNNER_TEMP/strict-$label" checkout --quiet --detach "$sha"
          done
          printf '#!/bin/sh\nexit 0\n' > "$RUNNER_TEMP/strict-fake-compiler"
          chmod 700 "$RUNNER_TEMP/strict-fake-compiler"
          python3 -B - <<'PY'
          import json, os, urllib.request
          env = os.environ
          url = f"https://api.github.com/repos/{env['GITHUB_REPOSITORY']}/actions/runs/{env['GITHUB_RUN_ID']}/attempts/{env['GITHUB_RUN_ATTEMPT']}/jobs?per_page=100"
          req = urllib.request.Request(url, headers={"Authorization": "Bearer " + env["GH_TOKEN"], "Accept": "application/vnd.github+json", "User-Agent": "iyi-strict-proof-ci"})
          with urllib.request.urlopen(req, timeout=30) as response:
              jobs = json.load(response)["jobs"]
          matches = [j for j in jobs if j.get("runner_name") == env["RUNNER_NAME"] and j.get("status") == "in_progress"]
          if len(matches) != 1:
              raise SystemExit("Current hosted job missing or ambiguous")
          job = matches[0]
          with open(env["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"job_id={job['id']}\njob_key={env['GITHUB_JOB']}\njob_started_at_iso={job['started_at']}\n")
          PY
      - name: Start unrelated ownership sentinel
        id: sentinel
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/strict-sentinel.py" <<'PY'
          import json, os, pathlib, secrets, socket, subprocess
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          sock_path = str(root / "strict-sentinel.sock")
          token = secrets.token_hex(32)
          server = socket.socket(socket.AF_UNIX, socket.SOCK_STREAM)
          server.bind(sock_path)
          server.listen(4)
          identity = json.loads(subprocess.check_output([
              "python3", ".github/actions/strict-supervisor/src/process_identity.py", str(os.getpid())], text=True))
          if identity.get("status") != "LIVE" or not identity.get("birth"):
              raise RuntimeError("Sentinel kernel identity unavailable")
          (root / "strict-sentinel.json").write_text(json.dumps({"pid": os.getpid(), "birth": identity["birth"], "token": token, "socket": sock_path}))
          while True:
              conn, _ = server.accept()
              with conn:
                  request = conn.recv(128).decode()
                  if request == token:
                      conn.sendall(token.encode())
                  elif request == token + ":stop":
                      conn.sendall(token.encode())
                      break
          server.close()
          PY
          RUNNER_TRACKING_ID= nohup python3 -B "$RUNNER_TEMP/strict-sentinel.py" > "$RUNNER_TEMP/strict-sentinel.log" 2>&1 &
          for n in $(seq 1 100); do
            test -s "$RUNNER_TEMP/strict-sentinel.json" && break
            sleep 0.1
          done
          python3 -B - <<'PY'
          import json, os, pathlib, socket, subprocess
          data = json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "strict-sentinel.json").read_text())
          identity = json.loads(subprocess.check_output(["python3", ".github/actions/strict-supervisor/src/process_identity.py", str(data["pid"])], text=True))
          assert identity["status"] == "LIVE" and identity["birth"] == data["birth"]
          with socket.socket(socket.AF_UNIX, socket.SOCK_STREAM) as s:
              s.settimeout(5)
              s.connect(data["socket"])
              s.sendall(data["token"].encode())
              assert s.recv(128).decode() == data["token"]
          PY

      - name: Synthetic controller crash and ownership recovery
        id: ownership-crash-case
        continue-on-error: true
        uses: ./.github/actions/strict-supervisor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mode: validation-only
          validation_case: ${{ matrix.case }}
          invocation_id: synthetic-${{ matrix.case }}
          case_data_dir: ${{ runner.temp }}/ownership-case
          p: ${{ runner.temp }}/strict-p
          w: ${{ runner.temp }}/strict-w
          compiler: ${{ runner.temp }}/strict-fake-compiler
          artifacts_dir: ${{ runner.temp }}/ownership-artifacts
          job_start_time: ${{ steps.setup.outputs.job_started_at_iso }}
          job_id: ${{ steps.setup.outputs.job_id }}
          job_key: ${{ steps.setup.outputs.job_key }}
          p_sha: ${{ env.P_AUTHORIZED_SHA }}
          w_sha: ${{ env.W_AUTHORIZED_SHA }}
          c_sha: ${{ github.sha }}

      - name: Preserve quarantine ledger
        if: ${{ always() }}
        env:
          CRASH_INDEX: ${{ steps.ownership-crash-case.outputs.receipt_index_path }}
        run: |
          python3 -B - <<'PY'
          import json, os, pathlib
          index = json.loads(pathlib.Path(os.environ["CRASH_INDEX"]).read_text())
          ledger = pathlib.Path(index["ownership_ledger"]) / "ownership.jsonl"
          (pathlib.Path(os.environ["RUNNER_TEMP"]) / "ownership-before-retry.jsonl").write_bytes(ledger.read_bytes())
          PY

      - name: Refuse changed invocation on quarantined host
        id: retry-case
        continue-on-error: true
        uses: ./.github/actions/strict-supervisor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mode: validation-only
          validation_case: success
          invocation_id: synthetic-restart-attempt
          case_data_dir: ${{ runner.temp }}/retry-case
          p: ${{ runner.temp }}/strict-p
          w: ${{ runner.temp }}/strict-w
          compiler: ${{ runner.temp }}/strict-fake-compiler
          artifacts_dir: ${{ runner.temp }}/retry-artifacts
          job_start_time: ${{ steps.setup.outputs.job_started_at_iso }}
          job_id: ${{ steps.setup.outputs.job_id }}
          job_key: ${{ steps.setup.outputs.job_key }}
          p_sha: ${{ env.P_AUTHORIZED_SHA }}
          w_sha: ${{ env.W_AUTHORIZED_SHA }}
          c_sha: ${{ github.sha }}

      - name: Verify ownership recovery and unrelated sentinel
        if: ${{ always() && steps.sentinel.outcome == 'success' }}
        env:
          CRASH_INDEX: ${{ steps.ownership-crash-case.outputs.receipt_index_path }}
          CRASH_OUTCOME: ${{ steps.ownership-crash-case.outcome }}
          RETRY_OUTCOME: ${{ steps.retry-case.outcome }}
          RETRY_INDEX: ${{ steps.retry-case.outputs.receipt_index_path }}
          CASE: ${{ matrix.case }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JOB_ID: ${{ steps.setup.outputs.job_id }}
          JOB_KEY: ${{ steps.setup.outputs.job_key }}
        run: |
          python3 -B - <<'PY'
          import io, json, os, pathlib, socket, tarfile, subprocess, sys, zipfile
          from proof.github_artifact import download_artifact_zip
          from proof.check_remote_strict_evidence import check_ownership_failure, check_quarantine_retry
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          data = json.loads((root / "strict-sentinel.json").read_text())
          try:
              identity = json.loads(subprocess.check_output(["python3", ".github/actions/strict-supervisor/src/process_identity.py", str(data["pid"])], text=True))
              if identity.get("status") != "LIVE" or identity.get("birth") != data["birth"]:
                  sys.exit("Sentinel identity changed or unavailable")
              with socket.socket(socket.AF_UNIX, socket.SOCK_STREAM) as s:
                  s.settimeout(5)
                  s.connect(data["socket"])
                  s.sendall(data["token"].encode())
                  if s.recv(128).decode() != data["token"]:
                      sys.exit("Sentinel did not respond")
              if os.environ["CRASH_OUTCOME"] != "failure" or os.environ["RETRY_OUTCOME"] != "failure":
                  sys.exit("Expected both action invocations to fail")
              index = json.loads(pathlib.Path(os.environ["CRASH_INDEX"]).read_text())
              if index.get("execution_kind") != "synthetic" or index.get("invocation_id") != "synthetic-" + os.environ["CASE"]:
                  sys.exit("Ownership invocation binding mismatch")
              context = index["ownership_journal"][0]["context"]
              expected = {"invocation_id": index["invocation_id"], "execution_kind": "synthetic",
                  "repository": os.environ["GITHUB_REPOSITORY"], "run_id": os.environ["GITHUB_RUN_ID"],
                  "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"], "job_id": os.environ["JOB_ID"],
                  "job_key": os.environ["JOB_KEY"], "p_sha": os.environ["P_AUTHORIZED_SHA"],
                  "w_sha": os.environ["W_AUTHORIZED_SHA"], "c_sha": os.environ["GITHUB_SHA"]}
              if any(context.get(key) != value for key, value in expected.items()):
                  sys.exit("Ownership context does not match current run and source tuple")
              downloads = root / "ownership-downloads"
              downloads.mkdir()
              for entry in index["entries"]:
                  artifact_id = str(entry["ack"]["artifact_id"])
                  if not artifact_id.isdecimal() or (downloads / (artifact_id + ".tar")).exists():
                      sys.exit("Invalid or duplicate prior artifact ID")
                  url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{artifact_id}/zip"
                  payload = download_artifact_zip(url, os.environ["GH_TOKEN"])
                  with zipfile.ZipFile(io.BytesIO(payload)) as zipped:
                      files = [item for item in zipped.infolist() if not item.is_dir()]
                      if len(files) != 1 or files[0].file_size > 100_000_000:
                          sys.exit("Invalid prior artifact layout")
                      (downloads / (artifact_id + ".tar")).write_bytes(zipped.read(files[0]))
              fake_compiler = os.path.realpath(os.path.join(os.environ["RUNNER_TEMP"], "strict-fake-compiler"))
              report = check_ownership_failure(index, str(root / "ownership-case"), os.environ["CASE"], str(downloads), expected, fake_compiler)
              ledger = pathlib.Path(index["ownership_ledger"]) / "ownership.jsonl"
              before = (root / "ownership-before-retry.jsonl").read_bytes()
              retry = json.loads(pathlib.Path(os.environ["RETRY_INDEX"]).read_text())
              check_quarantine_retry(index, retry, before, ledger.read_bytes())
              if (root / "retry-case").exists() or (root / "retry-artifacts").exists():
                  sys.exit("Refused invocation started controller work")
              report.update({"action_outcome": os.environ["CRASH_OUTCOME"], "retry_action_outcome": os.environ["RETRY_OUTCOME"],
                  "sentinel_pid": data["pid"], "sentinel_birth": data["birth"], "sentinel_survived": True})
              report_path = root / "strict-ownership-report.json"
              report_path.write_text(json.dumps(report, sort_keys=True))
              with tarfile.open(root / "strict-ownership-evidence.tar", "w") as archive:
                  archive.add(report_path, arcname="report.json")
                  archive.add(ledger, arcname="ownership.jsonl")
                  archive.add(os.environ["CRASH_INDEX"], arcname="receipt-index.json")
                  archive.add(os.environ["RETRY_INDEX"], arcname="retry-receipt-index.json")
                  for payload in sorted(downloads.glob("*.tar")):
                      archive.add(payload, arcname="prior-receipts/" + payload.name)
          finally:
              with socket.socket(socket.AF_UNIX, socket.SOCK_STREAM) as s:
                  s.settimeout(5)
                  s.connect(data["socket"])
                  s.sendall((data["token"] + ":stop").encode())
                  if s.recv(128).decode() != data["token"]:
                      raise RuntimeError("Sentinel stop handshake failed")
          PY

      - name: Upload isolated ownership evidence
        uses: actions/upload-artifact@v4
        with:
          name: remote-strict-${{ matrix.case }}-evidence
          path: ${{ runner.temp }}/strict-ownership-evidence.tar
          if-no-files-found: error

  ownership-inventory:
    name: "Verify complete hosted evidence inventory"
    needs: [validation-proofs, ownership-recovery, bootstrap-supervisor-bundle]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all artifact identities
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -B - <<'PY'
          import json, os, sys, urllib.request
          env = os.environ
          artifacts = []
          page = 1
          while True:
              url = f"https://api.github.com/repos/{env['GITHUB_REPOSITORY']}/actions/runs/{env['GITHUB_RUN_ID']}/artifacts?per_page=100&page={page}"
              req = urllib.request.Request(url, headers={"Authorization": "Bearer " + env["GH_TOKEN"], "Accept": "application/vnd.github+json", "User-Agent": "iyi-strict-proof-ci"})
              with urllib.request.urlopen(req, timeout=30) as response:
                  batch = json.load(response)["artifacts"]
              artifacts.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
          names = [item["name"] for item in artifacts]
          ids = [str(item["id"]) for item in artifacts]
          expected_fixed = [f"supervisor-bundle-{env['GITHUB_SHA']}", "remote-strict-validation-evidence",
              "remote-strict-ownership-crash-evidence", "remote-strict-ownership-census-outage-evidence",
              "remote-strict-ownership-run1-outage-evidence"]
          counts = {"success": 37, "failed-plan": 1, "failed-pin": 2, "divergence": 6, "cleanup-failure": 4, "ownership-run1-outage": 4, "ownership-census-outage": 1}
          if len(names) != 60 or len(set(names)) != 60 or len(set(ids)) != 60 or any(names.count(name) != 1 for name in expected_fixed):
              sys.exit("Missing, duplicate, or extra hosted evidence artifacts")
          for case, count in counts.items():
              if sum(name.startswith(f"proof-synthetic-{case}-") for name in names) != count:
                  sys.exit(f"Unexpected artifact count for {case}")
          PY

  prepare-strict-authorization:
    name: "Prepare strict authorization manifest"
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'strict-chain' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      artifact_id: ${{ steps.upload-manifest.outputs.artifact-id }}
      manifest_digest: ${{ steps.prepare.outputs.manifest_digest }}
    steps:
      - name: Checkout controller repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fb717ef66e47be571215a8227276183 # v5.3.0
        with:
          python-version: "3.12"

      - name: Validate evidence V and independent review E inputs
        id: validate-inputs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V_RUN_ID: ${{ github.event.inputs.v_run_id }}
          V_ARTIFACTS: ${{ github.event.inputs.v_artifacts }}
          REVIEW_PATH: ${{ github.event.inputs.review_path || 'proof/review_evidence.json' }}
          REVIEW_SHA256: ${{ github.event.inputs.review_sha256 }}
          REVIEW_VERDICT: ${{ github.event.inputs.review_verdict || 'GO' }}
        run: |
          python3 -B - <<'PY'
          import hashlib, json, os, sys, urllib.request

          # 1. Validate V inputs
          v_run_id = os.environ.get("V_RUN_ID", "").strip()
          if not v_run_id or not v_run_id.isdigit():
              sys.exit(f"Validation refused: v_run_id must be a non-empty numeric run ID, got {v_run_id!r}")

          v_art_raw = os.environ.get("V_ARTIFACTS", "").strip()
          if not v_art_raw:
              sys.exit("Validation refused: v_artifacts input is required")

          if os.path.exists(v_art_raw):
              with open(v_art_raw, "r", encoding="utf-8") as f:
                  v_artifacts = json.load(f)
          else:
              try:
                  v_artifacts = json.loads(v_art_raw)
              except Exception as exc:
                  sys.exit(f"Validation refused: v_artifacts is not valid JSON: {exc}")

          if not isinstance(v_artifacts, list) or len(v_artifacts) == 0:
              sys.exit("Validation refused: v_artifacts must be a non-empty list of artifact records")

          for art in v_artifacts:
              if not isinstance(art, dict) or "id" not in art or "name" not in art or "sha256" not in art:
                  sys.exit(f"Validation refused: artifact record must contain id, name, and sha256: {art}")
              if not str(art["id"]).isdigit():
                  sys.exit(f"Validation refused: artifact id must be numeric decimal: {art['id']}")
              if len(art["sha256"]) != 64 or not all(c in "0123456789abcdef" for c in str(art["sha256"]).lower()):
                  sys.exit(f"Validation refused: artifact sha256 must be 64-hex string: {art['sha256']}")

          # 2. Validate independent review E
          review_path = os.environ.get("REVIEW_PATH", "proof/review_evidence.json").strip()
          review_sha = os.environ.get("REVIEW_SHA256", "").strip()
          review_verdict = os.environ.get("REVIEW_VERDICT", "GO").strip()

          if review_verdict != "GO":
              sys.exit(f"Validation refused: independent review verdict must be GO, got {review_verdict!r}")

          if not os.path.exists(review_path):
              sys.exit(f"Validation refused: independent review file not found at {review_path}")

          with open(review_path, "rb") as rf:
              review_bytes = rf.read()

          computed_review_sha = hashlib.sha256(review_bytes).hexdigest()
          if review_sha and review_sha.lower() != computed_review_sha.lower():
              sys.exit(f"Validation refused: review_sha256 mismatch for {review_path}: expected {review_sha}, computed {computed_review_sha}")

          try:
              review_data = json.loads(review_bytes.decode("utf-8"))
              if isinstance(review_data, dict):
                  decl_verdict = review_data.get("verdict") or review_data.get("report", {}).get("verdict")
                  if decl_verdict and decl_verdict != "GO":
                      sys.exit(f"Validation refused: review file declares non-GO verdict: {decl_verdict}")
          except Exception as exc:
              sys.exit(f"Validation refused: unable to parse review JSON at {review_path}: {exc}")

          # 3. Authenticate V run status and completion via GitHub API
          token = os.environ.get("GH_TOKEN")
          repo = os.environ.get("GITHUB_REPOSITORY", "jwaldrip/iyi")
          if token:
              url = f"https://api.github.com/repos/{repo}/actions/runs/{v_run_id}"
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "iyi-strict-prepare-validator",
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      v_run = json.load(resp)
                  if v_run.get("status") != "completed" or v_run.get("conclusion") != "success":
                      sys.exit(f"Validation refused: V run {v_run_id} status={v_run.get('status')}, conclusion={v_run.get('conclusion')} (must be completed/success)")
              except Exception as exc:
                  sys.exit(f"Validation refused: failed to verify V run {v_run_id} via GitHub API: {exc}")

          print("Successfully validated V evidence and reviewed E before manifest preparation.")
          PY

      - name: Prepare canonical manifest and immutable package
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          V_RUN_ID: ${{ github.event.inputs.v_run_id }}
          V_ARTIFACTS: ${{ github.event.inputs.v_artifacts }}
          REVIEW_PATH: ${{ github.event.inputs.review_path || 'proof/review_evidence.json' }}
          REVIEW_SHA256: ${{ github.event.inputs.review_sha256 }}
          REVIEW_VERDICT: ${{ github.event.inputs.review_verdict || 'GO' }}
          P_SHA: ${{ github.event.inputs.p_sha || env.P_AUTHORIZED_SHA }}
          W_SHA: ${{ github.event.inputs.w_sha || env.W_AUTHORIZED_SHA }}
        run: |
          mkdir -p "$RUNNER_TEMP/manifest-pkg"
          PREP_ARGS=(
            prepare
            --manifest "$RUNNER_TEMP/manifest-pkg/manifest.json"
            --p-sha "$P_SHA"
            --w-sha "$W_SHA"
            --c-sha "${{ github.sha }}"
            --s-run-id "${{ github.run_id }}"
            --s-run-attempt "${{ github.run_attempt }}"
            --workflow-path ".github/workflows/remote-strict-proof.yml"
            --v-run-id "$V_RUN_ID"
            --v-artifacts "$V_ARTIFACTS"
            --review-path "$REVIEW_PATH"
            --review-verdict "$REVIEW_VERDICT"
            --backend "local-quiet-darwin"
            --chain-id "iyi-strict-proof-chain-v1"
            --output-digest "$RUNNER_TEMP/manifest-pkg/digest.txt"
          )
          if [ -n "$REVIEW_SHA256" ]; then
            PREP_ARGS+=(--review-sha256 "$REVIEW_SHA256")
          fi

          python3 -B proof/strict_authorization.py "${PREP_ARGS[@]}"

          D=$(cat "$RUNNER_TEMP/manifest-pkg/digest.txt")
          test -n "$D"
          COMPUTED_D=$(python3 -B -c "import hashlib; print(hashlib.sha256(open('$RUNNER_TEMP/manifest-pkg/manifest.json', 'rb').read()).hexdigest())")
          if [ "$D" != "$COMPUTED_D" ]; then
            echo "ERROR: Manifest digest mismatch: $D vs $COMPUTED_D" >&2
            exit 1
          fi
          echo "manifest_digest=$D" >> "$GITHUB_OUTPUT"
          echo "Prepared canonical manifest with exact digest D: $D"

      - name: Upload immutable manifest package
        id: upload-manifest
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf6581a120002692624f # v4.4.3
        with:
          name: strict-proof-manifest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/manifest-pkg/manifest.json
          if-no-files-found: error
          retention-days: 14
  strict-chain:
    name: "Sequential strict-chain gate (strict-proof)"
    needs: prepare-strict-authorization
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'strict-chain' }}
    runs-on: ubuntu-latest
    environment: strict-proof
    timeout-minutes: 60
    steps:
      - name: Checkout controller repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fb717ef66e47be571215a8227276183 # v5.3.0
        with:
          python-version: "3.12"

      - name: Download manifest package by exact artifact ID and verify archive
        id: download-manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT_ID: ${{ needs.prepare-strict-authorization.outputs.artifact_id }}
          EXPECTED_DIGEST: ${{ needs.prepare-strict-authorization.outputs.manifest_digest }}
        run: |
          python3 -B - <<'PY'
          import hashlib, io, json, os, sys, zipfile
          from proof.github_artifact import download_artifact_zip

          token = os.environ["GH_TOKEN"]
          repo = os.environ["GITHUB_REPOSITORY"]
          artifact_id = os.environ["ARTIFACT_ID"].strip()
          expected_d = os.environ["EXPECTED_DIGEST"].strip()

          if not artifact_id or not artifact_id.isdigit():
              sys.exit(f"Invalid manifest artifact ID from preparation: {artifact_id!r}")
          if not expected_d or len(expected_d) != 64:
              sys.exit(f"Invalid expected manifest digest from preparation: {expected_d!r}")

          url = f"https://api.github.com/repos/{repo}/actions/artifacts/{artifact_id}/zip"
          dest = os.path.join(os.environ["RUNNER_TEMP"], "manifest-download.zip")
          try:
              data = download_artifact_zip(url, token)
          except Exception as exc:
              sys.exit(f"Failed to download manifest artifact {artifact_id}: {exc}")

          with open(dest, "wb") as f:
              f.write(data)

          outer_sha = hashlib.sha256(data).hexdigest()
          print(f"Downloaded manifest artifact {artifact_id} ({len(data)} bytes, outer SHA-256 {outer_sha})")

          unpacked = os.path.join(os.environ["RUNNER_TEMP"], "manifest-unpacked")
          os.makedirs(unpacked, exist_ok=True)

          try:
              with zipfile.ZipFile(io.BytesIO(data), "r") as zf:
                  namelist = zf.namelist()
                  if len(namelist) != len(set(namelist)):
                      sys.exit("Duplicate member names found in downloaded manifest artifact archive")
                  entries = [e for e in zf.infolist() if not e.is_dir()]
                  if len(entries) != 1 or entries[0].filename != "manifest.json":
                      sys.exit(f"Archive layout mismatch: expected exactly ['manifest.json'], got {[e.filename for e in entries]}")
                  manifest_entry = entries[0]
                  if manifest_entry.file_size > 10_000_000:
                      sys.exit(f"Manifest member unexpectedly large: {manifest_entry.file_size} bytes")
                  raw_bytes = zf.read(manifest_entry)
          except Exception as exc:
              sys.exit(f"Corrupted or invalid manifest archive: {exc}")

          computed_d = hashlib.sha256(raw_bytes).hexdigest()
          if computed_d.lower() != expected_d.lower():
              sys.exit(f"Manifest member digest mismatch: expected D={expected_d}, computed={computed_d}")

          manifest_file = os.path.join(unpacked, "manifest.json")
          with open(manifest_file, "wb") as f:
              f.write(raw_bytes)

          print(f"Verified manifest member {manifest_file} with exact digest D={computed_d}")
          PY
      - name: Verify approval and manifest against authoritative GitHub API
        id: check-auth
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/receipt"
          python3 -B proof/strict_authorization.py check \
            --manifest "$RUNNER_TEMP/manifest-unpacked/manifest.json" \
            --receipt "$RUNNER_TEMP/receipt/strict-authorization-receipt.json"

      - name: Upload authorization receipt artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf6581a120002692624f # v4.4.3
        with:
          name: strict-authorization-receipt-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/receipt/strict-authorization-receipt.json
          if-no-files-found: error
          retention-days: 14
