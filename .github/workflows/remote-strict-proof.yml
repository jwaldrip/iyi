name: Remote Strict Proof Chain (macOS 15)

# Branch-only macOS-15 GitHub Actions rail for PR147 strict chain.
# Validation-only mode runs automatically on push to the integrated repair branch
# (proof/strict-controller-integration-20261101 or proof/strict-lifecycle-repair-20261102),
# or manually via workflow_dispatch.
# Real strict execution is unconditionally refused nonzero before P1 build until
# independently authenticated authorization exists.

on:
  push:
    branches:
      - "proof/strict-controller-integration-20261101"
      - "proof/strict-lifecycle-repair-20261102"
  workflow_dispatch:
    inputs:
      mode:
        description: "Execution mode: 'validation-only' runs synthetic proofs and supervisor tests. 'strict-chain' is unconditionally refused until independent authorization exists."
        required: true
        type: choice
        options:
          - "validation-only"
          - "strict-chain"
        default: "validation-only"

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"
  PYTHONUTF8: "1"
  PYTHONPATH: "."
  P_AUTHORIZED_SHA: "626463375298d357ffcb3223059f4d3adce6fb10"
  W_AUTHORIZED_SHA: "b932ce0d97775c7061102a13db706f507dc84117"
  DRIVER_LIMIT_SEC: "2100"
  GRACE_SEC: "30"
  HOST_JOB_LIMIT_SEC: "21600"
  PAYLOAD_BUDGET_SEC: "19800"
  FINALIZATION_ALLOC_SEC: "1800"
  MIN_DISK_GIB: "20.0"

jobs:
  validation-proofs:
    name: "Controller synthetic and validation proofs (macOS 15)"
    if: ${{ github.event_name == 'push' || github.event.inputs.mode == 'validation-only' }}
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Checkout controller repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Pre-create CI diagnostic directories
        run: |
          mkdir -p "$RUNNER_TEMP/strict-ci/ci-logs" "$RUNNER_TEMP/strict-ci/fingerprints"

      - name: Record initial machine fingerprints and environment
        run: |
          echo "================================================================================"
          echo "INITIAL MACHINE FINGERPRINTS"
          echo "================================================================================"
          echo "Architecture: $(uname -m)"
          echo "OS: $(uname -s) $(uname -r) $(uname -v)"
          echo "CPU Brand: $(sysctl -n machdep.cpu.brand_string 2>/dev/null || true)"
          echo "Logical CPUs (hw.ncpu): $(sysctl -n hw.ncpu 2>/dev/null || true)"
          echo "Physical CPUs (hw.physicalcpu): $(sysctl -n hw.physicalcpu 2>/dev/null || true)"
          echo "Memory (bytes): $(sysctl -n hw.memsize 2>/dev/null || true)"
          vm_stat || true
          echo "Initial Disk Usage:"
          df -h /
          df -k /

      - name: Install bootstrap toolchain and DNS utilities
        run: |
          brew install crystal coreutils pkgconf bind

          # Expose only timeout via owned symlink; avoid GNU gnubin shadowing Darwin mktemp
          OWNED_BIN="$RUNNER_TEMP/owned-bin"
          mkdir -p "$OWNED_BIN"
          GTIMEOUT_PATH="$(brew --prefix)/bin/gtimeout"
          if [ -x "$GTIMEOUT_PATH" ]; then
            ln -sf "$GTIMEOUT_PATH" "$OWNED_BIN/timeout"
          elif [ -x "$(brew --prefix coreutils)/bin/gtimeout" ]; then
            ln -sf "$(brew --prefix coreutils)/bin/gtimeout" "$OWNED_BIN/timeout"
          else
            echo "ERROR: gtimeout not found in Homebrew prefix" >&2
            exit 1
          fi
          echo "$OWNED_BIN" >> "$GITHUB_PATH"

          # Add bind utilities (dig, nsupdate) to PATH
          BIND_BIN="$(brew --prefix bind)/bin"
          if [ -d "$BIND_BIN" ]; then
            echo "$BIND_BIN" >> "$GITHUB_PATH"
          fi

      - name: Verify Darwin BSD mktemp invariant
        run: |
          MKTEMP_PATH=$(which mktemp)
          echo "mktemp path: $MKTEMP_PATH"
          if [ "$MKTEMP_PATH" != "/usr/bin/mktemp" ]; then
            echo "ERROR: Darwin mktemp shadowed! Expected /usr/bin/mktemp, got $MKTEMP_PATH" >&2
            exit 1
          fi
          TEST_DIR=$(/usr/bin/mktemp -d -t iyi_check.XXXXXX)
          rm -rf "$TEST_DIR"
          echo "Darwin BSD /usr/bin/mktemp verified (not shadowed by GNU gnubin)"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml "idna==3.11" cryptography pillow h2 hpack
          python3 -c "import idna; assert idna.__version__ == '3.11', f'idna version mismatch: {idna.__version__}'"
          echo "idna==3.11 verified"

      - name: Verify approved oracle manifest before pre-pin
        run: |
          python3 -B proof/preflight_oracle.py --manifest proof/oracle_manifest.json

      - name: Record canonical modules, tool versions, and repository references
        run: |
          set -e
          set -o pipefail
          python3 -B - <<'PY'
          import hashlib, json, os, subprocess

          manifest = {
              "c_head": subprocess.check_output(["git", "rev-parse", "HEAD"]).decode().strip(),
              "branch": subprocess.check_output(["git", "rev-parse", "--abbrev-ref", "HEAD"]).decode().strip(),
              "python": subprocess.check_output(["python3", "--version"]).decode().strip(),
              "modules": {},
          }
          for mod in (
              "proof/proofkit.py",
              "proof/run_proof.py",
              "proof/remote_strict_controller.py",
              "proof/native_validation.py",
              "proof/remote_strict_fixtures.py",
              "proof/remote_strict_validation.py",
          ):
              if os.path.isfile(mod):
                  with open(mod, "rb") as f:
                      manifest["modules"][mod] = hashlib.sha256(f.read()).hexdigest()

          with open(os.path.join(os.environ["RUNNER_TEMP"], "strict-ci/fingerprints/manifest.json"), "w") as f:
              json.dump(manifest, f, indent=2)
          print("Recorded module fingerprints:", json.dumps(manifest, indent=2))
          PY

      - name: Resolve exact current job
        id: job-metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -B - <<'PY'
          import json, os, sys, urllib.request
          from datetime import datetime

          repo = os.environ["GITHUB_REPOSITORY"]
          run = os.environ["GITHUB_RUN_ID"]
          attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          key = os.environ["GITHUB_JOB"]
          runner = os.environ["RUNNER_NAME"]
          if not run.isdecimal() or not attempt.isdecimal() or key != "validation-proofs" or not runner:
              sys.exit("Invalid job context")
          jobs = []
          page = 1
          while True:
              url = (f"https://api.github.com/repos/{repo}/actions/runs/{run}/attempts/"
                     f"{attempt}/jobs?per_page=100&page={page}")
              request = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "iyi-strict-proof-ci",
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  batch = json.load(response)["jobs"]
              jobs.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
          matches = [j for j in jobs if j.get("name") == "Controller synthetic and validation proofs (macOS 15)"
                     and j.get("runner_name") == runner and j.get("status") == "in_progress"
                     and str(j.get("run_id")) == run and str(j.get("run_attempt")) == attempt]
          if len(matches) != 1:
              sys.exit(f"Expected exactly one current job, found {len(matches)}")
          job = matches[0]
          job_id = str(job.get("id", ""))
          started = job.get("started_at", "")
          if not job_id.isdecimal() or not started:
              sys.exit("Missing numeric job ID or start time")
          epoch = datetime.fromisoformat(started.replace("Z", "+00:00")).timestamp()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"job_started_at_iso={started}\njob_id={job_id}\njob_key={key}\n")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write(f"STRICT_JOB_START_ISO={started}\nSTRICT_JOB_START_EPOCH={epoch}\n")
          print(f"Matched job {job_id}, attempt {attempt}, key {key}")
          PY

      - name: Checkout actual P and W without building
        id: source-trees
        run: |
          set -euo pipefail
          for entry in "p:$P_AUTHORIZED_SHA" "w:$W_AUTHORIZED_SHA"; do
            label="${entry%%:*}"
            expected="${entry#*:}"
            path="$RUNNER_TEMP/strict-$label"
            git clone --quiet --no-checkout "$GITHUB_WORKSPACE" "$path"
            git -C "$path" checkout --quiet --detach "$expected"
            test "$(git -C "$path" rev-parse HEAD)" = "$expected"
            test -z "$(git -C "$path" status --porcelain)"
            echo "${label}_path=$path" >> "$GITHUB_OUTPUT"
          done
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          compiler="$RUNNER_TEMP/strict-fake-compiler"
          printf '#!/bin/sh\nexit 0\n' > "$compiler"
          chmod 700 "$compiler"
          echo "compiler=$compiler" >> "$GITHUB_OUTPUT"

      - name: Verify frozen supervisor bundle and test
        run: |
          set -euo pipefail
          npm --prefix .github/actions/strict-supervisor ci
          npm --prefix .github/actions/strict-supervisor run build
          git diff --exit-code -- .github/actions/strict-supervisor/dist
          npm --prefix .github/actions/strict-supervisor test
          DIST_PATH=".github/actions/strict-supervisor/dist/index.js"
          test -f "$DIST_PATH"
          BUNDLE_SHA=$(shasum -a 256 "$DIST_PATH" | awk '{print $1}')
          echo "Verified action bundle SHA-256: $BUNDLE_SHA"
          echo "{\"bundle_sha256\": \"$BUNDLE_SHA\"}" > "$RUNNER_TEMP/strict-ci/fingerprints/bundle.json"
          # The following uses: steps must execute the tracked bundle without source dependencies.
          rm -rf .github/actions/strict-supervisor/node_modules

      - name: Run Python deterministic controller test suite with watchdog
        run: |
          set -e
          set -o pipefail
          echo "================================================================================"
          echo "Running RemoteStrictController deterministic contract tests (600s watchdog)"
          echo "================================================================================"

          # Bounded 600-second suite watchdog with faulthandler diagnostics
          PYTHONFAULTHANDLER=1 timeout 600s python3 -B -X faulthandler -m unittest discover -s proof -p 'test_remote_strict*.py' -v 2>&1 | tee "$RUNNER_TEMP/strict-ci/ci-logs/python-controller-suite.log"

      - name: Verify exact strict mode refusal without independent authorization
        run: |
          set -e
          set -o pipefail
          echo "================================================================================"
          echo "Verifying exact strict mode refusal (exit 5, AUTH_REFUSED)..."
          echo "================================================================================"

          set +e
          python3 -B -m proof.remote_strict_controller \
            --mode strict \
            --p "${{ steps.source-trees.outputs.p_path }}" \
            --w "${{ steps.source-trees.outputs.w_path }}" \
            --compiler "${{ steps.source-trees.outputs.compiler }}" \
            --job-start-time "$STRICT_JOB_START_ISO" \
            --artifacts-dir "$RUNNER_TEMP/strict-ci/strict-refusal" \
            --driver-limit-sec 2100 \
            --grace-sec 30 > "$RUNNER_TEMP/strict-ci/ci-logs/strict-refusal.stdout.log" 2> "$RUNNER_TEMP/strict-ci/ci-logs/strict-refusal.stderr.log"
          RC=$?
          set -e

          echo "Strict mode exit code: $RC"
          if [ "$RC" -ne 5 ]; then
            echo "ERROR: Expected strict refusal exit code 5, got $RC" >&2
            cat "$RUNNER_TEMP/strict-ci/ci-logs/strict-refusal.stderr.log" >&2
            exit 1
          fi

          SUMMARY_FILE="$RUNNER_TEMP/strict-ci/strict-refusal/strict-controller-summary.json"
          if [ ! -f "$SUMMARY_FILE" ]; then
            echo "ERROR: Summary file missing from strict refusal: $SUMMARY_FILE" >&2
            exit 1
          fi

          python3 -c "
          import json, sys
          with open('$SUMMARY_FILE', 'r') as f:
              s = json.load(f)
          assert s.get('overall_status') == 'AUTH_REFUSED', f'Expected overall_status AUTH_REFUSED, got {s.get(\"overall_status\")}'
          assert len(s.get('records', [])) == 0, f'Expected 0 stage records launched, got {len(s.get(\"records\"))}'
          print('Strict refusal VERIFIED: exit=5, overall_status=AUTH_REFUSED, zero stages launched.')
          "

      - name: Synthetic capacity success
        id: success-case
        uses: ./.github/actions/strict-supervisor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mode: validation-only
          validation_case: success
          invocation_id: synthetic-success
          case_data_dir: ${{ runner.temp }}/strict-case-success
          p: ${{ steps.source-trees.outputs.p_path }}
          w: ${{ steps.source-trees.outputs.w_path }}
          compiler: ${{ steps.source-trees.outputs.compiler }}
          artifacts_dir: ${{ runner.temp }}/strict-artifacts-success
          job_start_time: ${{ steps.job-metadata.outputs.job_started_at_iso }}
          job_id: ${{ steps.job-metadata.outputs.job_id }}
          job_key: ${{ steps.job-metadata.outputs.job_key }}
          p_sha: ${{ env.P_AUTHORIZED_SHA }}
          w_sha: ${{ env.W_AUTHORIZED_SHA }}
          c_sha: ${{ github.sha }}

      - name: Synthetic failed plan
        id: failed-plan-case
        continue-on-error: true
        uses: ./.github/actions/strict-supervisor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mode: validation-only
          validation_case: failed-plan
          invocation_id: synthetic-failed-plan
          case_data_dir: ${{ runner.temp }}/strict-case-failed-plan
          p: ${{ steps.source-trees.outputs.p_path }}
          w: ${{ steps.source-trees.outputs.w_path }}
          compiler: ${{ steps.source-trees.outputs.compiler }}
          artifacts_dir: ${{ runner.temp }}/strict-artifacts-failed-plan
          job_start_time: ${{ steps.job-metadata.outputs.job_started_at_iso }}
          job_id: ${{ steps.job-metadata.outputs.job_id }}
          job_key: ${{ steps.job-metadata.outputs.job_key }}
          p_sha: ${{ env.P_AUTHORIZED_SHA }}
          w_sha: ${{ env.W_AUTHORIZED_SHA }}
          c_sha: ${{ github.sha }}

      - name: Synthetic failed pin
        id: failed-pin-case
        continue-on-error: true
        uses: ./.github/actions/strict-supervisor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mode: validation-only
          validation_case: failed-pin
          invocation_id: synthetic-failed-pin
          case_data_dir: ${{ runner.temp }}/strict-case-failed-pin
          p: ${{ steps.source-trees.outputs.p_path }}
          w: ${{ steps.source-trees.outputs.w_path }}
          compiler: ${{ steps.source-trees.outputs.compiler }}
          artifacts_dir: ${{ runner.temp }}/strict-artifacts-failed-pin
          job_start_time: ${{ steps.job-metadata.outputs.job_started_at_iso }}
          job_id: ${{ steps.job-metadata.outputs.job_id }}
          job_key: ${{ steps.job-metadata.outputs.job_key }}
          p_sha: ${{ env.P_AUTHORIZED_SHA }}
          w_sha: ${{ env.W_AUTHORIZED_SHA }}
          c_sha: ${{ github.sha }}

      - name: Synthetic Run3 divergence
        id: divergence-case
        continue-on-error: true
        uses: ./.github/actions/strict-supervisor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mode: validation-only
          validation_case: divergence
          invocation_id: synthetic-divergence
          case_data_dir: ${{ runner.temp }}/strict-case-divergence
          p: ${{ steps.source-trees.outputs.p_path }}
          w: ${{ steps.source-trees.outputs.w_path }}
          compiler: ${{ steps.source-trees.outputs.compiler }}
          artifacts_dir: ${{ runner.temp }}/strict-artifacts-divergence
          job_start_time: ${{ steps.job-metadata.outputs.job_started_at_iso }}
          job_id: ${{ steps.job-metadata.outputs.job_id }}
          job_key: ${{ steps.job-metadata.outputs.job_key }}
          p_sha: ${{ env.P_AUTHORIZED_SHA }}
          w_sha: ${{ env.W_AUTHORIZED_SHA }}
          c_sha: ${{ github.sha }}

      - name: Synthetic cleanup failure
        id: cleanup-case
        continue-on-error: true
        uses: ./.github/actions/strict-supervisor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mode: validation-only
          validation_case: cleanup-failure
          invocation_id: synthetic-cleanup-failure
          case_data_dir: ${{ runner.temp }}/strict-case-cleanup-failure
          p: ${{ steps.source-trees.outputs.p_path }}
          w: ${{ steps.source-trees.outputs.w_path }}
          compiler: ${{ steps.source-trees.outputs.compiler }}
          artifacts_dir: ${{ runner.temp }}/strict-artifacts-cleanup-failure
          job_start_time: ${{ steps.job-metadata.outputs.job_started_at_iso }}
          job_id: ${{ steps.job-metadata.outputs.job_id }}
          job_key: ${{ steps.job-metadata.outputs.job_key }}
          p_sha: ${{ env.P_AUTHORIZED_SHA }}
          w_sha: ${{ env.W_AUTHORIZED_SHA }}
          c_sha: ${{ github.sha }}

      - name: Download exact artifact IDs and independently check all cases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          W_PATH: ${{ steps.source-trees.outputs.w_path }}
          P_PATH: ${{ steps.source-trees.outputs.p_path }}
          COMPILER_PATH: ${{ steps.source-trees.outputs.compiler }}
          JOB_ID: ${{ steps.job-metadata.outputs.job_id }}
          JOB_KEY: ${{ steps.job-metadata.outputs.job_key }}
          SUCCESS_INDEX: ${{ steps.success-case.outputs.receipt_index_path }}
          PLAN_INDEX: ${{ steps.failed-plan-case.outputs.receipt_index_path }}
          PIN_INDEX: ${{ steps.failed-pin-case.outputs.receipt_index_path }}
          DIVERGENCE_INDEX: ${{ steps.divergence-case.outputs.receipt_index_path }}
          CLEANUP_INDEX: ${{ steps.cleanup-case.outputs.receipt_index_path }}
          SUCCESS_OUTCOME: ${{ steps.success-case.outcome }}
          PLAN_OUTCOME: ${{ steps.failed-plan-case.outcome }}
          PIN_OUTCOME: ${{ steps.failed-pin-case.outcome }}
          DIVERGENCE_OUTCOME: ${{ steps.divergence-case.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup-case.outcome }}
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import io, json, os, pathlib, subprocess, sys, tarfile, urllib.request, zipfile

          temp = pathlib.Path(os.environ["RUNNER_TEMP"])
          downloads = temp / "strict-exact-downloads"
          reports = temp / "strict-checked-reports"
          downloads.mkdir()
          reports.mkdir()
          cases = [
              ("success", "SUCCESS", 37), ("failed-plan", "PLAN", 1),
              ("failed-pin", "PIN", 2), ("divergence", "DIVERGENCE", 6),
              ("cleanup-failure", "CLEANUP", 4),
          ]
          seen = set()
          for case, prefix, expected_count in cases:
              expected_outcome = "success" if case == "success" else "failure"
              if os.environ[prefix + "_OUTCOME"] != expected_outcome:
                  sys.exit(f"{case}: unexpected action outcome")
              index = pathlib.Path(os.environ[prefix + "_INDEX"])
              with index.open(encoding="utf-8") as f:
                  envelope = json.load(f)
              entries = envelope["entries"]
              if len(entries) != expected_count:
                  sys.exit(f"{case}: expected {expected_count} artifacts, got {len(entries)}")
              for entry in entries:
                  artifact_id = str(entry["ack"]["artifact_id"])
                  if not artifact_id.isdecimal() or artifact_id in seen:
                      sys.exit(f"{case}: invalid or duplicate artifact ID")
                  seen.add(artifact_id)
                  url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/artifacts/{artifact_id}/zip"
                  req = urllib.request.Request(url, headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "User-Agent": "iyi-strict-independent-readback",
                  })
                  with urllib.request.urlopen(req, timeout=60) as response:
                      payload = response.read()
                  with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                      files = [item for item in archive.infolist() if not item.is_dir()]
                      if len(files) != 1 or files[0].file_size > 100_000_000:
                          sys.exit(f"{case}: invalid downloaded artifact layout")
                      data = archive.read(files[0])
                  (downloads / f"{artifact_id}.tar").write_bytes(data)
              command = ["python3", "-B", "proof/check_remote_strict_evidence.py",
                         "--index", str(index), "--downloads-dir", str(downloads),
                         "--case", case, "--p", os.environ["P_PATH"], "--w", os.environ["W_PATH"],
                         "--c", os.environ["GITHUB_WORKSPACE"], "--compiler", os.environ["COMPILER_PATH"],
                         "--repository", os.environ["GITHUB_REPOSITORY"],
                         "--run-id", os.environ["GITHUB_RUN_ID"], "--run-attempt", os.environ["GITHUB_RUN_ATTEMPT"],
                         "--job-id", os.environ["JOB_ID"], "--job-key", os.environ["JOB_KEY"],
                         "--invocation-id", "synthetic-" + case, "--report", str(reports / f"{case}.json")]
              if case == "divergence":
                  command += ["--expected-divergence", str(temp / "strict-case-divergence" / "divergence.bin")]
              subprocess.run(command, check=True)
          if len(seen) != 50:
              sys.exit("Expected exactly 50 distinct incremental artifact IDs")
          (temp / "strict-checked-ids.json").write_text(json.dumps(sorted(seen)), encoding="utf-8")
          export = temp / "strict-verified-evidence.tar"
          with tarfile.open(export, "w") as tar:
              for case, _, _ in cases:
                  report = reports / f"{case}.json"
                  if not report.is_file() or report.is_symlink():
                      sys.exit(f"{case}: checked report missing or unsafe")
                  tar.add(report, arcname=f"{case}.json", recursive=False)
          PY

      - name: Upload checked sealed evidence
        id: sealed-export
        uses: actions/upload-artifact@v4
        with:
          name: remote-strict-validation-evidence
          path: ${{ runner.temp }}/strict-verified-evidence.tar
          retention-days: 14
          if-no-files-found: error

      - name: Check exact hosted artifact inventory
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPORT_ID: ${{ steps.sealed-export.outputs.artifact-id }}
        run: |
          python3 -B - <<'PY'
          import json, os, pathlib, sys, urllib.request
          expected = set(json.loads((pathlib.Path(os.environ["RUNNER_TEMP"]) / "strict-checked-ids.json").read_text()))
          export = os.environ["EXPORT_ID"]
          if not export.isdecimal() or export in expected:
              sys.exit("Missing or duplicate sealed export ID")
          expected.add(export)
          ids = []
          page = 1
          while True:
              url = (f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                     f"{os.environ['GITHUB_RUN_ID']}/artifacts?per_page=100&page={page}")
              request = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "iyi-strict-proof-ci",
              })
              with urllib.request.urlopen(request, timeout=30) as response:
                  batch = json.load(response)["artifacts"]
              ids.extend(str(item["id"]) for item in batch)
              if len(batch) < 100:
                  break
              page += 1
          if len(ids) != 51 or set(ids) != expected:
              sys.exit(f"Hosted inventory mismatch: expected 51 exact IDs, got {len(ids)}")
          print("Verified all 51 exact artifact IDs")
          PY

  strict-chain:
    name: "Sequential strict-chain attempt (macOS 15)"
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.mode == 'strict-chain' }}
    runs-on: macos-15
    timeout-minutes: 360  # 6-hour GitHub Actions maximum limit
    steps:
      - name: Authenticate independent authorization anchor
        id: check-auth
        run: |
          echo "================================================================================" >&2
          echo "STRICT-CHAIN REFUSAL: Independent authenticated authorization is absent." >&2
          echo "================================================================================" >&2
          echo "Real strict execution requires independently authenticated authorization" >&2
          echo "for the exact (P, W, C) tuple: repository, P SHA, W SHA, C SHA," >&2
          echo "harness workflow/run/attempt, harness evidence digest, and independent" >&2
          echo "audit evidence digest with GO." >&2
          echo "The protected environment was selected; its manifest-bound verifier is not integrated." >&2
          echo "Refusing execution nonzero before P1 build, W checkout, or native execution." >&2
          exit 1

      - name: Resolve exact current job
        id: job-metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 -B - <<'PY'
          import json, os, sys, urllib.request
          from datetime import datetime
          repo = os.environ["GITHUB_REPOSITORY"]
          run = os.environ["GITHUB_RUN_ID"]
          attempt = os.environ["GITHUB_RUN_ATTEMPT"]
          key = os.environ["GITHUB_JOB"]
          runner = os.environ["RUNNER_NAME"]
          if not run.isdecimal() or not attempt.isdecimal() or key != "strict-chain" or not runner:
              sys.exit("Invalid job context")
          jobs = []
          page = 1
          while True:
              url = (f"https://api.github.com/repos/{repo}/actions/runs/{run}/attempts/"
                     f"{attempt}/jobs?per_page=100&page={page}")
              req = urllib.request.Request(url, headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "iyi-strict-proof-ci",
              })
              with urllib.request.urlopen(req, timeout=30) as response:
                  batch = json.load(response)["jobs"]
              jobs.extend(batch)
              if len(batch) < 100:
                  break
              page += 1
          matches = [j for j in jobs if j.get("name") == "Sequential strict-chain attempt (macOS 15)"
                     and j.get("runner_name") == runner and j.get("status") == "in_progress"
                     and str(j.get("run_id")) == run and str(j.get("run_attempt")) == attempt]
          if len(matches) != 1:
              sys.exit(f"Expected exactly one current job, found {len(matches)}")
          job = matches[0]
          job_id = str(job.get("id", ""))
          started = job.get("started_at", "")
          if not job_id.isdecimal() or not started:
              sys.exit("Missing numeric job ID or start time")
          epoch = datetime.fromisoformat(started.replace("Z", "+00:00")).timestamp()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"job_started_at_iso={started}\njob_started_at_epoch={epoch}\njob_id={job_id}\njob_key={key}\n")
          PY

      - name: Checkout controller repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Record initial machine fingerprints and environment
        run: |
          echo "================================================================================"
          echo "INITIAL MACHINE FINGERPRINTS"
          echo "================================================================================"
          echo "Architecture: $(uname -m)"
          echo "OS: $(uname -s) $(uname -r) $(uname -v)"
          echo "CPU Brand: $(sysctl -n machdep.cpu.brand_string 2>/dev/null || true)"
          echo "Logical CPUs (hw.ncpu): $(sysctl -n hw.ncpu 2>/dev/null || true)"
          echo "Physical CPUs (hw.physicalcpu): $(sysctl -n hw.physicalcpu 2>/dev/null || true)"
          echo "Memory (bytes): $(sysctl -n hw.memsize 2>/dev/null || true)"
          vm_stat || true
          echo "Initial Disk Usage:"
          df -h /
          df -k /

      - name: Install bootstrap toolchain and DNS utilities
        run: |
          brew install crystal coreutils pkgconf bind

          # Expose only timeout via owned symlink; avoid GNU gnubin shadowing Darwin mktemp
          OWNED_BIN="$RUNNER_TEMP/owned-bin"
          mkdir -p "$OWNED_BIN"
          GTIMEOUT_PATH="$(brew --prefix)/bin/gtimeout"
          if [ -x "$GTIMEOUT_PATH" ]; then
            ln -sf "$GTIMEOUT_PATH" "$OWNED_BIN/timeout"
          elif [ -x "$(brew --prefix coreutils)/bin/gtimeout" ]; then
            ln -sf "$(brew --prefix coreutils)/bin/gtimeout" "$OWNED_BIN/timeout"
          else
            echo "ERROR: gtimeout not found in Homebrew prefix" >&2
            exit 1
          fi
          echo "$OWNED_BIN" >> "$GITHUB_PATH"

          # Add bind utilities (dig, nsupdate) to PATH
          BIND_BIN="$(brew --prefix bind)/bin"
          if [ -d "$BIND_BIN" ]; then
            echo "$BIND_BIN" >> "$GITHUB_PATH"
          fi

      - name: Verify Darwin BSD mktemp invariant
        run: |
          MKTEMP_PATH=$(which mktemp)
          echo "mktemp path: $MKTEMP_PATH"
          if [ "$MKTEMP_PATH" != "/usr/bin/mktemp" ]; then
            echo "ERROR: Darwin mktemp shadowed! Expected /usr/bin/mktemp, got $MKTEMP_PATH" >&2
            exit 1
          fi
          TEST_DIR=$(/usr/bin/mktemp -d -t iyi_check.XXXXXX)
          rm -rf "$TEST_DIR"
          echo "Darwin BSD /usr/bin/mktemp verified (not shadowed by GNU gnubin)"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Setup Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pyyaml "idna==3.11" cryptography pillow h2 hpack
          python3 -c "import idna; assert idna.__version__ == '3.11', f'idna version mismatch: {idna.__version__}'"
          echo "idna==3.11 verified"

      - name: Verify approved oracle manifest before pre-pin
        run: |
          python3 -B proof/preflight_oracle.py --manifest proof/oracle_manifest.json

      - name: Require frozen Node supervisor bundle
        run: test -f .github/actions/strict-supervisor/dist/index.js

      - name: Restore static LLVM cache
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: ~/llvm-static
          key: llvm-static-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-static-llvm.sh') }}

      - name: Build static LLVM (cache miss)
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-static-llvm.sh "$HOME/llvm-static"

      - name: Validate commit SHAs as data in environment
        run: |
          python3 -c "
          import os, re, sys
          for var in ('P_AUTHORIZED_SHA', 'W_AUTHORIZED_SHA'):
              val = os.environ.get(var, '')
              if not re.fullmatch(r'[0-9a-f]{40}', val):
                  sys.exit(f'ERROR: {var} is not a valid 40-character hex SHA: {val!r}')
          print(f'Authorized revision SHAs validated: P={os.environ[\"P_AUTHORIZED_SHA\"]}, W={os.environ[\"W_AUTHORIZED_SHA\"]}')
          "

      - name: Checkout clean P1 source and build P1 compiler
        id: build-p1
        run: |
          P1_DIR="$RUNNER_TEMP/p1-source"

          echo "Setting up clean P1 source checkout at $P1_DIR from $P_AUTHORIZED_SHA..."
          git clone "$GITHUB_WORKSPACE" "$P1_DIR"
          cd "$P1_DIR"
          git checkout --detach "$P_AUTHORIZED_SHA"

          ACTUAL_P1_SHA=$(git rev-parse HEAD)
          echo "P1 checkout HEAD: $ACTUAL_P1_SHA"
          if [ "$ACTUAL_P1_SHA" != "$P_AUTHORIZED_SHA" ]; then
            echo "ERROR: P1 checkout mismatch! Expected $P_AUTHORIZED_SHA, got $ACTUAL_P1_SHA" >&2
            exit 1
          fi

          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: P1 checkout is dirty!" >&2
            exit 1
          fi

          echo "Building P1 compiler using static LLVM..."
          make iyi LLVM_CONFIG="$HOME/llvm-static/bin/llvm-config"

          if [ ! -x ".build/iyi" ]; then
            echo "ERROR: .build/iyi was not generated or is not executable" >&2
            exit 1
          fi

          echo "=== P1 Compiler Version ==="
          VERSION_OUTPUT=$(.build/iyi --version)
          echo "$VERSION_OUTPUT"
          if ! echo "$VERSION_OUTPUT" | grep -q "626463375"; then
            echo "ERROR: Compiler version stamp does not contain P1 commit 626463375!" >&2
            exit 1
          fi
          echo "Compiler version stamp VERIFIED: contains 626463375."

          COMPILER_SHA256=$(shasum -a 256 .build/iyi | awk '{print $1}')
          echo "P1 Compiler SHA-256: $COMPILER_SHA256"

          # Prune build object files under P1 to maximize available disk space
          find .build -name '*.o' -delete 2>/dev/null || true

          cd "$GITHUB_WORKSPACE"

          # Verify available disk space is >= 20.0 GiB floor
          echo "=== Disk Space Check Post-Build ==="
          df -h /
          FREE_KB=$(df -k / | awk 'NR==2 {print $4}')
          FREE_GIB=$(python3 -c "print(round($FREE_KB / (1024 * 1024), 2))")
          echo "Available disk space: ${FREE_GIB} GiB"
          python3 -c "import sys; free_gib = float('$FREE_GIB'); sys.exit(0 if free_gib >= 20.0 else f'ERROR: Free disk space {free_gib} GiB < 20.0 GiB minimum')"
          echo "Disk space check PASSED: ${FREE_GIB} GiB >= 20.0 GiB"

          echo "p1_dir=$P1_DIR" >> "$GITHUB_OUTPUT"
          echo "compiler_path=$P1_DIR/.build/iyi" >> "$GITHUB_OUTPUT"
          echo "compiler_sha256=$COMPILER_SHA256" >> "$GITHUB_OUTPUT"

      - name: Checkout clean audited W proof tree
        id: checkout-w
        run: |
          W_DIR="$RUNNER_TEMP/w-proof"

          echo "Setting up clean W proof checkout at $W_DIR from $W_AUTHORIZED_SHA..."
          git clone "$GITHUB_WORKSPACE" "$W_DIR"
          cd "$W_DIR"
          git checkout --detach "$W_AUTHORIZED_SHA"

          ACTUAL_W_SHA=$(git rev-parse HEAD)
          echo "W checkout HEAD: $ACTUAL_W_SHA"
          if [ "$ACTUAL_W_SHA" != "$W_AUTHORIZED_SHA" ]; then
            echo "ERROR: W checkout mismatch! Expected $W_AUTHORIZED_SHA, got $ACTUAL_W_SHA" >&2
            exit 1
          fi

          if [ -n "$(git status --porcelain)" ]; then
            echo "ERROR: W checkout is dirty!" >&2
            exit 1
          fi

          # Verify non-proof product equality between P1 and W
          echo "Verifying product equality outside proof/ between P1 and W..."
          NON_PROOF_DIFF=$(git diff --name-only "$P_AUTHORIZED_SHA" "$W_AUTHORIZED_SHA" -- . ':(exclude)proof')
          if [ -n "$NON_PROOF_DIFF" ]; then
            echo "ERROR: Non-proof product diff found between P1 and W:" >&2
            echo "$NON_PROOF_DIFF" >&2
            exit 1
          fi
          echo "Product equality outside proof/ VERIFIED: zero differences."

          echo "w_dir=$W_DIR" >> "$GITHUB_OUTPUT"

      - name: Launch Strict Proof Supervisor
        id: run-strict-supervisor
        uses: ./.github/actions/strict-supervisor
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          p: ${{ steps.build-p1.outputs.p1_dir }}
          w: ${{ steps.checkout-w.outputs.w_dir }}
          compiler: ${{ steps.build-p1.outputs.compiler_path }}
          artifacts_dir: strict-proof-artifacts
          job_start_time: ${{ steps.job-metadata.outputs.job_started_at_iso }}
          job_id: ${{ steps.job-metadata.outputs.job_id }}
          job_key: ${{ steps.job-metadata.outputs.job_key }}
          invocation_id: strict-${{ github.run_id }}-${{ github.run_attempt }}
          host_job_limit_sec: ${{ env.HOST_JOB_LIMIT_SEC }}
          payload_budget_sec: ${{ env.PAYLOAD_BUDGET_SEC }}
          finalization_alloc_sec: ${{ env.FINALIZATION_ALLOC_SEC }}
          driver_limit_sec: ${{ env.DRIVER_LIMIT_SEC }}
          grace_sec: ${{ env.GRACE_SEC }}
          min_disk_gib: ${{ env.MIN_DISK_GIB }}
          p_sha: ${{ env.P_AUTHORIZED_SHA }}
          w_sha: ${{ env.W_AUTHORIZED_SHA }}
          c_sha: ${{ github.sha }}
          mode: 'strict'

