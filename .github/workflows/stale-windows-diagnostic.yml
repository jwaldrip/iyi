name: Windows stale acceptance diagnostics

on:
  push:
    branches: [probe/stale-acceptance-183-20261118]

permissions:
  contents: read

concurrency:
  group: windows-stale-diagnostics-${{ github.ref }}
  cancel-in-progress: true

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: "*"
  PYTHONUTF8: "1"
  STALE_TARGET: x86_64-windows-msvc

jobs:
  windows-proof:
    runs-on: windows-2025
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
      - uses: crystal-lang/install-crystal@36a22e9145188eec527c96e5a789ce4b832af587
        with:
          crystal: 1.21.0
      - name: Prepare the existing Windows toolchain
        shell: pwsh
        run: |
          if (-not (Get-Command make -ErrorAction SilentlyContinue)) {
            choco install make --version 4.4.1 --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "choco could not install make 4.4.1" }
            $make = Join-Path $env:ChocolateyInstall 'lib\make\tools\install\bin\make.exe'
            $hash = (Get-FileHash -Algorithm SHA256 $make).Hash.ToLower()
            if ($hash -ne 'cc6dc291113dcbcc7735835acbfc23c52ed037e4e124ff2d7a0aeae6df563a9f') {
              throw "Chocolatey's make.exe is not the one pinned here: $hash"
            }
          }
          $lib = (crystal env CRYSTAL_LIBRARY_PATH).Trim()
          $llvm = (Get-Content "$lib\llvm_VERSION")[0].Trim()
          "CRYSTAL_LIBRARY_PATH=$lib" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          "LLVM_VERSION=$llvm" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14"
      - name: Build the compiler and iyi
        shell: cmd
        run: |
          make -f Makefile.win crystal || exit /b 1
          make -f Makefile.win iyi
      - name: Set the producer compiler path
        id: producer
        run: echo "IYI=$(cygpath -m "$PWD/.build/iyi.exe")" >> "$GITHUB_ENV"
      - name: Diagnose stale receipt acceptance
        env:
          STALE_TESTS_KEEP_GOING: "1"
        run: bash bench/stale_tests.sh
      - name: Diagnose observer chmod behavior
        if: ${{ !cancelled() && steps.producer.outcome == 'success' }}
        run: bash bench/stale_chmod_failure.sh
