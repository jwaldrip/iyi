name: Strict authorization synthetic controls

on:
  push:
    branches:
      - 'master'
      - 'proof/strict-approval-binding-20261105'
      - 'proof/strict-approval-policy-fix-20261106'
      - 'proof/strict-approval-integration-20261107'
      - 'proof/strict-approval-repair-20261107'
      - 'proof/strict-selected-audit-attestation-20261107'
      - 'proof/strict-lifecycle-repair-20261102'
      - 'experiment/pr147-slice-c-workflow'
  pull_request:
    branches:
      - 'master'
      - 'proof/strict-lifecycle-repair-20261102'
  workflow_dispatch:
permissions:
  contents: read

jobs:
  synthetic-controls:
    name: "Synthetic authorization controls"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@0b93645e9fb717ef66e47be571215a8227276183 # v5.3.0
        with:
          python-version: "3.12"
      - name: Run authorization candidate controls and non-native harmless effect
        run: python3 -B -m unittest proof.test_strict_authorization -v
