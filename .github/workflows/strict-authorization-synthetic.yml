name: Strict authorization synthetic controls

on:
  push:
    branches:
      - 'proof/strict-approval-binding-20261105'
      - 'proof/strict-approval-policy-fix-20261106'
      - 'proof/strict-approval-integration-20261107'
      - 'proof/strict-approval-repair-20261107'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run authorization candidate controls and non-native harmless effect
        run: python3 -B -m unittest proof.test_strict_authorization -v
