<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 648 236" width="648" height="236" role="img" aria-label="rebuild after one edit: iyi 0.13 seconds, Crystal 1.17 seconds, go build 0.16 seconds">
  <style>
    :root { --fg: #1f2328; --dim: #656d76; --bg: #ffffff; --other: #8c959f; }
    @media (prefers-color-scheme: dark) {
      :root { --fg: #e6edf3; --dim: #8d96a0; --bg: #0d1117; --other: #6e7681; }
    }
    text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { font-size: 17px; font-weight: 700; fill: var(--fg); }
    .sub { font-size: 12.5px; fill: var(--dim); }
    .name { font-size: 13.5px; fill: var(--fg); text-anchor: end; }
    .value { font-size: 13.5px; font-weight: 600; fill: var(--fg); }
  </style>
  <defs><linearGradient id="iyi" x1="0" x2="1"><stop offset="0" stop-color="#2da44e"/><stop offset="1" stop-color="#3fb950"/></linearGradient></defs>
  <rect width="648" height="236" fill="var(--bg)"/>
  <text x="120" y="30" class="title" text-anchor="end">Rebuild after one edit</text>
  <text x="132" y="30" class="title">7,208 lines, 30 modules, one line changed</text>
  <text x="132" y="50" class="sub">seconds, best of 7, one machine, release compilers</text>
  <text x="120" y="94" class="name">iyi</text><rect x="132" y="74" width="47" height="30" rx="4" fill="url(#iyi)"/><text x="191" y="95" class="value">0.13 s</text><text x="120" y="140" class="name">Crystal</text><rect x="132" y="120" width="420" height="30" rx="4" fill="var(--other)"/><text x="564" y="141" class="value">1.17 s</text><text x="120" y="186" class="name">go build</text><rect x="132" y="166" width="57" height="30" rx="4" fill="var(--other)"/><text x="201" y="187" class="value">0.16 s</text>
</svg>
